name: Update Atlas

on:
  push:
    branches:
      - main

jobs:
  pack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pack atlas
        uses: yairm210/Unciv-Atlas-Packer@master

      - name: Commit atlas
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update texture atlas"
          file_pattern: "game.png game.atlas Atlases.json"
